[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sibyl"
version = "0.1.0"
description = "An LLM-powered research paper review system"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Sibyl Contributors", email = "sibyl@example.com"}
]
keywords = ["llm", "research", "paper", "review", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "requests>=2.31.0",
    "pypdf>=3.17.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
web = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
]

[project.scripts]
sibyl = "sibyl.cli:main"

[project.urls]
Homepage = "https://github.com/cvasilatos/sibyl"
Repository = "https://github.com/cvasilatos/sibyl"

[tool.hatch.build.targets.wheel]
packages = ["src/sibyl"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".git", ".mypy_cache", ".ruff_cache", "examples"]
src = ["./src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "PLR0913",  # Too many arguments
    "PLR2004",  # Magic value used in comparison
    "PLR0915",  # Too many statements
    "PLR0912",  # Too many branches
    "G004",     # Logging statement uses f-string
    "INP001",   # Implicit namespace package
    "ANN401",   # Dynamically typed expressions (Any)
    "ANN201",   # Missing return type annotation for public function
    "ANN202",   # Missing return type annotation for private function
    "ANN204",   # Missing return type annotation for special method
    "ANN001",   # Missing type annotation for function argument
    "COM812",   # Trailing comma missing
    "ISC001",   # Implicitly concatenated string literals on one line
    "TRY003",   # Avoid specifying long messages outside exception class
    "EM101",    # Exception must not use string literal
    "EM102",    # Exception must not use f-string literal
    "ERA001",   # Found commented-out code
    "BLE001",   # Do not catch blind exception
    "T201",     # print found
    "S311",     # Standard pseudo-random generators are not suitable for security
    "C408",     # Unnecessary dict call
    "C901",     # Function too complex
    "S101",     # Use of assert detected
    "PERF203",  # try-except within a loop
    "D203",     # 1 blank line required before class docstring (conflicts with D211)
    "D213",     # Multi-line docstring summary should start at the second line (conflicts with D212)
    "D107",     # Missing docstring in __init__
    "D102",     # Missing docstring in public method
    "D401",     # First line of docstring should be in imperative mood
    "E501",     # Line too long (let formatter handle this)
    "DTZ005",   # datetime without timezone
    "PTH123",   # Use Path.open() instead of open()
    "UP035",    # Use modern type hints
    "UP006",    # Use modern type hints
    "FA100",    # Add future annotations import
    "B904",     # raise from within except
    "PT011",    # pytest.raises too broad
]
unfixable = ["F401"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=sibyl --cov-report=term-missing"
