services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "21434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
    # Uncomment the section below to enable NVIDIA GPU support:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [ gpu ]
              device_ids: [ '1' ]

  grobid:
    image: lfoppiano/grobid:0.8.0
    ports:
      - "8070:8070"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      # Override localhost URLs so the backend talks to sibling containers
      - OLLAMA_BASE_URL=http://ollama:11434
      - GROBID_URL=http://grobid:8070
      - GROBID_ENABLED=true
    depends_on:
      - ollama
      - grobid
    volumes:
      - sibyl_storage:/app/sibyl_storage
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # The browser calls the API directly, so use the host-exposed port.
        - NEXT_PUBLIC_API_URL=http://hydra.abudhabi.nyu.edu:8000
    ports:
      - "4000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
  sibyl_storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/cv43/sibyl/sibyl_storage
