services:
  # Main Ollama server on all GPUs: pulls models and runs the ones too big for a single GPU.
  # The backend detects the GPUs itself (NVML) and starts one pinned `ollama serve` per GPU on
  # demand, sharing this model store, so nothing here depends on how many GPUs the machine has.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - SIBYL_ENGINE=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      # Per-GPU servers read models from the shared store pulled by the main server.
      - SIBYL_OLLAMA_MODELS=/root/.ollama/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    depends_on:
      - ollama
    volumes:
      - sibyl_storage:/app/sibyl_storage
      - ollama_data:/root/.ollama
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://hydra.abudhabi.nyu.edu:8000
    ports:
      - "4000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/cv43/sibyl/ollama_data
  sibyl_storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/cv43/sibyl/sibyl_storage
