# Sibyl – Docker Compose
#
# Services:
#   ollama   – local LLM inference (GPU pass-through supported, see comment below)
#   grobid   – PDF metadata extraction
#   backend  – Python/FastAPI API server
#   web      – Next.js frontend
#
# Quick start:
#   1. cp .env.example .env          # set OLLAMA_MODEL (e.g. llama3.2)
#   2. docker compose up -d
#   3. docker compose exec ollama ollama pull llama3.2
#   4. Open http://localhost:3000
#
# The backend communicates with ollama and grobid using their service names
# over the internal Docker network.  The Next.js frontend always calls the
# backend via the host-exposed port (http://localhost:8000) from the browser,
# so NEXT_PUBLIC_API_URL defaults to http://localhost:8000.

services:
  # ---------------------------------------------------------------------------
  # Ollama – local LLM server
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Uncomment the section below to enable NVIDIA GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # GROBID – academic PDF metadata extraction
  # ---------------------------------------------------------------------------
  grobid:
    image: lfoppiano/grobid:0.8.0
    ports:
      - "8070:8070"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend – Python FastAPI service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override localhost URLs so the backend talks to sibling containers
      - OLLAMA_BASE_URL=http://ollama:11434
      - GROBID_URL=http://grobid:8070
      - GROBID_ENABLED=true
    depends_on:
      - ollama
      - grobid
    volumes:
      - sibyl_storage:/app/sibyl_storage
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Web – Next.js frontend
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # The browser calls the API directly, so use the host-exposed port.
        # Change this if the backend is served behind a reverse proxy.
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  ollama_data:
  sibyl_storage:
