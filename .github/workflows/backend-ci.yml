name: Backend CI

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - "web/openapi.json"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "backend/**"
      - "web/openapi.json"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --group dev --group test

      - name: OpenAPI schema is up to date
        run: |
          uv run python -m sibyl.openapi ../web/openapi.json
          git diff --exit-code -- ../web/openapi.json || {
            echo "::error::web/openapi.json is out of date. Run 'npm run gen:api' in web/ and commit the result."
            exit 1
          }

      - name: Run tests with coverage
        run: uv run pytest -v --cov=sibyl --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
