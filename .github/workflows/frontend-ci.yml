name: Frontend CI

on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and format
        run: npx biome ci .

      - name: API client is up to date
        run: |
          npm run gen:api:types
          git diff --exit-code -- src/lib/api/schema.d.ts || {
            echo "::error::src/lib/api/schema.d.ts is out of date. Run 'npm run gen:api' in web/ and commit the result."
            exit 1
          }

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build (validates TypeScript)
        run: npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: web/coverage/
