#:schema https://json.schemastore.org/pyproject.json
#:schmea https://json.schemastore.org/ruff.json

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sibyl"
version = "0.1.0"
description = "An LLM-powered research paper review system"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Christoforos Vasilatos", email = "cv43@nyu.edu" }]
keywords = ["llm", "research", "paper", "review", "ai"]

dependencies = [
    "requests>=2.31.0",
    "pypdf>=3.17.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "tabulate>=0.9.0",
    "chromadb>=0.4.0",
    "fastapi>=0.129.0",
    "aiofiles>=25.1.0",
    "uvicorn>=0.41.0",
    "ollama>=0.6.1",
    "httpx>=0.27.0",
    "huggingface-hub>=0.30.0",
    "python-multipart>=0.0.22",
    "nvidia-ml-py>=12.0.0",
    "decima",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    "grobid-client-python>=0.1.4",
    "grobid-tei-xml>=0.1.3",
    "marker-pdf>=1.10.2",
    "torch<=2.7.0",
    "defusedxml>=0.7.1",
    "typer>=0.24.0",
    "python-pam>=2.1.1",
]

[dependency-groups]
dev = ["pre-commit>=4.5.1", "ruff>=0.15.1", "ty>=0.0.17"]

test = ["pytest>=9.0.2", "pytest-cov>=7.0.0"]

[project.scripts]
sibyl = "sibyl.cli:app"

[project.urls]
Homepage = "https://github.com/cvasilatos/sibyl"
Repository = "https://github.com/cvasilatos/sibyl"

[tool.hatch.build.targets.wheel]
packages = ["src/sibyl"]

[tool.ty]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=sibyl --cov-report=term-missing"

[tool.uv.sources]
decima = { git = "https://github.com/cvasilatos/decima.git" }
